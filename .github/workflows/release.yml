name: release

# 打 tag（v3.2.0）或手动触发时，构建 Windows/macOS/Linux 安装包
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: 构建 ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            artifact_name: Shiyin-windows-x64
            asset_glob: "Shiyin-*-windows-x64-setup.exe"
          - os: macos-latest
            os_name: macos
            artifact_name: Shiyin-macos-arm64
            asset_glob: "Shiyin-*-macos-arm64.pkg"
          - os: ubuntu-24.04
            os_name: linux
            artifact_name: Shiyin-linux-amd64
            asset_glob: "shiyin_*_amd64.deb"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装运行与构建依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow pyinstaller

      # ---- 准备静态 ffmpeg/ffprobe（随安装包内置，免用户另行安装）----
      - name: 下载 ffmpeg / ffprobe（Windows / BtbN GPL 静态构建）
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          mkdir -p installer/bin
          curl -L --retry 3 -o /tmp/ffmpeg.zip \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z x /tmp/ffmpeg.zip -o/tmp/ffmpeg -y | tail -2
          cp /tmp/ffmpeg/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe installer/bin/
          cp /tmp/ffmpeg/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe installer/bin/
          ./installer/bin/ffmpeg.exe -version | head -1

      - name: 下载 ffmpeg / ffprobe（macOS arm64 / ffmpeg-static 静态构建）
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -e
          mkdir -p installer/bin
          BASE="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1"
          curl -L --retry 3 -o /tmp/ffmpeg.gz "$BASE/ffmpeg-darwin-arm64.gz"
          curl -L --retry 3 -o /tmp/ffprobe.gz "$BASE/ffprobe-darwin-arm64.gz"
          gunzip -c /tmp/ffmpeg.gz  > installer/bin/ffmpeg
          gunzip -c /tmp/ffprobe.gz > installer/bin/ffprobe
          chmod +x installer/bin/ffmpeg installer/bin/ffprobe
          installer/bin/ffmpeg -version | head -1

      - name: 下载 ffmpeg / ffprobe（Linux / johnvansickle 静态构建）
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          mkdir -p installer/bin /tmp/ffmpeg
          curl -L --retry 3 -o /tmp/ffmpeg.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          cp /tmp/ffmpeg/ffmpeg /tmp/ffmpeg/ffprobe installer/bin/
          chmod +x installer/bin/ffmpeg installer/bin/ffprobe
          installer/bin/ffmpeg -version | head -1

      # ---- 平台安装包 ----
      - name: 构建 Windows 安装向导（Inno Setup）
        if: matrix.os_name == 'windows'
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          powershell -ExecutionPolicy Bypass -File installer/build_windows.ps1

      - name: 构建 macOS .pkg
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          PYTHON="$(which python)" bash installer/build_macos.sh

      - name: 构建 Linux .deb
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          bash installer/build_linux.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_glob }}
          if-no-files-found: error
